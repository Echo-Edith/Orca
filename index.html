<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Server Builder</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { 
      background-color: #030712; 
      color: #f8fafc; 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden;
    }

    /* Ambient Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: #06b6d4;
    }
    .orb-2 {
      bottom: -20%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: #3b82f6;
      animation-delay: -9s;
    }
    .orb-3 {
      top: 40%;
      left: 30%;
      width: 40vw;
      height: 40vw;
      background: #6366f1;
      animation-delay: -5s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8%, 10%) scale(1.1); }
    }

    .glass-card { 
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
    }
    .btn-glow { 
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%); 
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); 
    }
    .btn-glow:hover { 
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); 
      transform: translateY(-1px); 
    }
    .tag-btn { 
      background: rgba(30, 41, 59, 0.7); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: all 0.2s ease; 
    }
    .tag-btn.active { 
      background: #06b6d4; 
      color: #030712; 
      border-color: #38bdf8; 
      font-weight: 800; 
    }
    .channel-item:hover { background: rgba(255, 255, 255, 0.05); }
    .channel-item.active-channel {
      background: rgba(6, 182, 212, 0.2);
      border-left: 3px solid #06b6d4;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Animated Background Orbs -->
  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 w-full glass-card border-b border-white/10 px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <span class="font-black text-sm md:text-base tracking-tight text-white">Discord Server Builder</span>
      </div>
      <button onclick="resetToBuilder()" class="btn-glow px-3.5 py-1.5 md:px-4 md:py-2 rounded-xl text-xs font-extrabold text-slate-950 transition-all">
        New Design
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 md:py-10 space-y-8 flex-1 w-full">

    <section class="text-center space-y-2">
      <h1 class="text-2xl md:text-4xl font-black tracking-tight leading-tight">
        Custom Discord <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Server Layout Generator</span>
      </h1>
      <p class="text-xs md:text-sm text-slate-400 max-w-lg mx-auto">
        Customize your server channels and roles, then submit your design directly to staff for automated deployment.
      </p>
    </section>

    <!-- STEP 1: FORM -->
    <section id="builderFormSection" class="glass-card p-5 md:p-8 rounded-3xl space-y-5 shadow-2xl">
      <div class="space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400">Server Description & Requirements</label>
          <textarea id="promptInput" rows="4" maxlength="4000" oninput="updateCharCount()" class="w-full bg-slate-950/80 border border-white/10 rounded-2xl p-3.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-all resize-none" placeholder="Describe channels, categories, and roles you need..."></textarea>
          <div class="text-right text-[10px] text-slate-500"><span id="charCount">0</span>/4000</div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400">Discord Server ID</label>
          <input type="text" id="guildIdInput" placeholder="Enter Server ID" value="123456789012345678" class="w-full bg-slate-950/80 border border-white/10 rounded-2xl p-3.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-all">
        </div>

        <div class="space-y-2 bg-slate-950/40 p-3.5 rounded-2xl border border-white/5">
          <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400">Channel Style Separator</label>
          <div class="flex flex-wrap gap-2" id="styleTags">
            <button type="button" onclick="setChannelStyle('emoji', this)" class="tag-btn active px-3 py-1.5 rounded-xl text-xs font-semibold">✓ Emoji</button>
            <button type="button" onclick="setChannelStyle('丨', this)" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold">丨</button>
            <button type="button" onclick="setChannelStyle('•', this)" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold">•</button>
            <button type="button" onclick="setChannelStyle('-', this)" class="tag-btn px-3 py-1.5 rounded-xl text-xs font-semibold">‐</button>
          </div>
        </div>

        <button id="generateBtn" onclick="generateLayout()" class="w-full btn-glow py-3.5 rounded-2xl text-xs font-black text-slate-950 flex items-center justify-center gap-2 transition-all">
          <span>✨ Generate Preview Layout</span>
        </button>
      </div>
    </section>

    <!-- STEP 2: DISCORD EDITOR PREVIEW -->
    <section id="previewSection" class="hidden space-y-6">
      <div class="glass-card rounded-3xl border border-white/10 overflow-hidden shadow-2xl">
        
        <div class="bg-slate-900/90 px-4 py-3 border-b border-white/10 flex items-center justify-between">
          <h2 class="font-black text-slate-100 text-xs md:text-sm">Server Layout Preview</h2>
        </div>

        <div id="discordTreeContainer" class="bg-slate-950/80 p-3 md:p-4 space-y-3 max-h-[400px] overflow-y-auto"></div>

        <div class="p-3 bg-slate-900/50 border-t border-white/10 flex gap-2">
          <input type="text" id="newCategoryInput" placeholder="+ New Category" class="flex-1 bg-slate-950 border border-white/10 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none">
          <button onclick="addNewCategory()" class="px-3 py-2 rounded-xl bg-cyan-500/20 text-cyan-300 text-xs font-bold border border-cyan-500/30">+ Category</button>
        </div>

        <div class="p-4 border-t border-white/10 bg-slate-900/30 space-y-2">
          <h4 class="text-xs font-bold uppercase text-slate-300">Roles</h4>
          <div id="rolesList" class="flex flex-wrap gap-2"></div>
          <div class="flex gap-2 pt-1">
            <input type="text" id="newRoleInput" placeholder="+ Role" class="bg-slate-950 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-slate-200">
            <button onclick="addNewRole()" class="px-3 py-1.5 rounded-xl bg-cyan-500/20 text-cyan-300 text-xs font-bold border border-cyan-500/30">Add</button>
          </div>
        </div>

        <div class="p-4 border-t border-white/10 bg-slate-950 space-y-2">
          <div class="flex items-center justify-between">
            <h4 class="text-xs font-bold uppercase text-slate-300">Channel Permissions</h4>
            <span id="permissionSelectedChannelLabel" class="text-xs font-mono text-cyan-300"></span>
          </div>
          <div id="rolePermsList" class="space-y-1.5"></div>
        </div>

        <div class="p-4 md:p-6 border-t border-white/10 bg-slate-900/90 text-center space-y-2">
          <button onclick="sendLayoutToStaff()" id="sendStaffBtn" class="w-full btn-glow py-3.5 rounded-2xl text-xs font-black text-slate-950 flex items-center justify-center gap-2 transition-all">
            <i class="fa-solid fa-paper-plane"></i>
            <span>SEND DESIGN TO STAFF</span>
          </button>
        </div>

      </div>
    </section>

  </main>

  <footer class="border-t border-white/10 py-4 px-4 text-center text-[11px] text-slate-500">
    Discord Server Builder • Fully Responsive Interface
  </footer>

  <script>
    const RENDER_API_URL = "https://orca-bot.onrender.com"; 

    let activeSeparator = "│";
    let activeStyleMode = "emoji";
    let selectedCatIndex = 0;
    let selectedChanIndex = 0;

    let generatedPayload = {
      guild_id: "",
      categories: [],
      roles: []
    };

    function setChannelStyle(style, btnElement) {
      document.querySelectorAll('#styleTags .tag-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      activeSeparator = style === 'emoji' ? '│' : style;
      renderDiscordTree();
    }

    function generateLayout() {
      const guildId = document.getElementById('guildIdInput').value.trim();
      if (!guildId) {
        alert("Please enter a Discord Server ID!");
        return;
      }

      generatedPayload.guild_id = guildId;
      generatedPayload.categories = [
        {
          name: "WELCOME",
          icon: "📌",
          channels: [
            { emoji: "📢", name: "announcements", topic: "Server updates", is_private: false },
            { emoji: "📜", name: "rules", topic: "Guidelines", is_private: false }
          ]
        },
        {
          name: "GENERAL",
          icon: "💬",
          channels: [
            { emoji: "💬", name: "general-chat", topic: "Community chat", is_private: false },
            { emoji: "🤖", name: "bot-commands", topic: "Bot commands", is_private: false }
          ]
        }
      ];

      generatedPayload.roles = [
        { name: "Admin", color: "#06b6d4", permissions: { view: true, send: true, manage: true } },
        { name: "Member", color: "#10b981", permissions: { view: true, send: true, manage: false } }
      ];

      document.getElementById('builderFormSection').classList.add('hidden');
      document.getElementById('previewSection').classList.remove('hidden');
      renderDiscordTree();
    }

    function resetToBuilder() {
      document.getElementById('previewSection').classList.add('hidden');
      document.getElementById('builderFormSection').classList.remove('hidden');
    }

    function renderDiscordTree() {
      const container = document.getElementById('discordTreeContainer');
      container.innerHTML = '';

      generatedPayload.categories.forEach((cat, catIdx) => {
        let catBlock = document.createElement('div');
        catBlock.className = "space-y-1 mb-2";

        catBlock.innerHTML = `
          <div class="flex items-center justify-between text-xs font-bold text-slate-400 uppercase py-1 px-1">
            <span>▼ ${cat.icon ? cat.icon + ' ' : ''}${cat.name}</span>
            <button onclick="deleteCategory(${catIdx})" class="text-slate-600 hover:text-red-400">✕</button>
          </div>
        `;

        let channelList = document.createElement('div');
        channelList.className = "pl-2 space-y-1";

        cat.channels.forEach((chan, chanIdx) => {
          const isActive = (catIdx === selectedCatIndex && chanIdx === selectedChanIndex);
          const chanDiv = document.createElement('div');
          chanDiv.className = `channel-item flex items-center justify-between p-2 rounded-xl text-xs cursor-pointer ${isActive ? 'active-channel text-cyan-300 font-bold' : 'text-slate-300'}`;
          chanDiv.onclick = () => { selectedCatIndex = catIdx; selectedChanIndex = chanIdx; renderDiscordTree(); };

          chanDiv.innerHTML = `
            <span># ${chan.emoji} ${activeSeparator} ${chan.name}</span>
            <button onclick="event.stopPropagation(); deleteChannel(${catIdx}, ${chanIdx})" class="text-slate-600 hover:text-red-400">✕</button>
          `;
          channelList.appendChild(chanDiv);
        });

        catBlock.appendChild(channelList);
        container.appendChild(catBlock);
      });

      renderRoles();
      renderPermissionsPanel();
    }

    function addNewCategory() {
      const val = document.getElementById('newCategoryInput').value.trim();
      if (!val) return;
      generatedPayload.categories.push({ name: val.toUpperCase(), icon: "📁", channels: [] });
      document.getElementById('newCategoryInput').value = '';
      renderDiscordTree();
    }

    function deleteCategory(catIdx) {
      generatedPayload.categories.splice(catIdx, 1);
      renderDiscordTree();
    }

    function deleteChannel(catIdx, chanIdx) {
      generatedPayload.categories[catIdx].channels.splice(chanIdx, 1);
      renderDiscordTree();
    }

    function renderRoles() {
      const list = document.getElementById('rolesList');
      list.innerHTML = '';
      generatedPayload.roles.forEach((role, idx) => {
        list.innerHTML += `
          <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs bg-slate-950 border border-white/10">
            <span class="w-2 h-2 rounded-full" style="background:${role.color}"></span>
            ${role.name}
            <button onclick="deleteRole(${idx})" class="text-slate-500 hover:text-red-400 ml-1">✕</button>
          </span>
        `;
      });
    }

    function addNewRole() {
      const val = document.getElementById('newRoleInput').value.trim();
      if (!val) return;
      generatedPayload.roles.push({ name: val, color: "#06b6d4", permissions: { view: true, send: true, manage: false } });
      document.getElementById('newRoleInput').value = '';
      renderDiscordTree();
    }

    function deleteRole(idx) {
      generatedPayload.roles.splice(idx, 1);
      renderDiscordTree();
    }

    function renderPermissionsPanel() {
      const cat = generatedPayload.categories[selectedCatIndex];
      const chan = cat ? cat.channels[selectedChanIndex] : null;
      if (!chan) return;

      document.getElementById('permissionSelectedChannelLabel').innerText = `# ${chan.name}`;
      const list = document.getElementById('rolePermsList');
      list.innerHTML = '';

      generatedPayload.roles.forEach((role, rIdx) => {
        const perms = role.permissions || { view: true, send: true, manage: false };
        list.innerHTML += `
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900 text-xs">
            <span>${role.name}</span>
            <div class="flex gap-1">
              <button onclick="toggleRolePerm(${rIdx}, 'view')" class="px-2 py-0.5 rounded text-[10px] ${perms.view ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}">View</button>
              <button onclick="toggleRolePerm(${rIdx}, 'send')" class="px-2 py-0.5 rounded text-[10px] ${perms.send ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-500'}">Send</button>
            </div>
          </div>
        `;
      });
    }

    function toggleRolePerm(roleIndex, permKey) {
      generatedPayload.roles[roleIndex].permissions[permKey] = !generatedPayload.roles[roleIndex].permissions[permKey];
      renderPermissionsPanel();
    }

    async function sendLayoutToStaff() {
      alert("Design submitted! Staff can now run /build file: in Orca Bot.");
    }

    function updateCharCount() {
      document.getElementById('charCount').innerText = document.getElementById('promptInput').value.length;
    }
  </script>
</body>
</html>
